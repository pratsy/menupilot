<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wayfare</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Karla:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <svg class="compass" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <line x1="16" y1="4" x2="16" y2="7.5" stroke="currentColor" stroke-width="1.4"/>
          <line x1="16" y1="24.5" x2="16" y2="28" stroke="currentColor" stroke-width="1.4"/>
          <line x1="4" y1="16" x2="7.5" y2="16" stroke="currentColor" stroke-width="1.4"/>
          <line x1="24.5" y1="16" x2="28" y2="16" stroke="currentColor" stroke-width="1.4"/>
          <path d="M16 9 L19 16 L16 23 L13 16 Z" class="needle" fill="currentColor"/>
        </svg>
        <div>
          <h1>Wayfare</h1>
          <p>Eat like you know the place.</p>
        </div>
      </div>
    </header>

    <main id="chat"></main>

    <form id="composer">
      <textarea id="input" placeholder="Where are you, and what are you craving?" rows="1"></textarea>
      <button id="send" type="submit">Go <span aria-hidden="true">→</span></button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
